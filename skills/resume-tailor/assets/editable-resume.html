<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岗位适配简历</title>
  <style>
    :root { --blue: #2456a6; --ink: #20242a; --muted: #5b6572; --line: #cdd9e9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f7; color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .toolbar { width: min(210mm, calc(100% - 24px)); margin: 18px auto 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .toolbar p { margin: 0; color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid var(--line); border-radius: 6px; background: white; padding: 8px 12px; cursor: pointer; font: inherit; font-size: 12px; }
    button.primary { background: var(--blue); border-color: var(--blue); color: white; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .page { width: 210mm; min-height: 297mm; margin: 0 auto 24px; padding: 17mm 18mm; background: white; box-shadow: 0 5px 24px #1c36521c; font-size: 10pt; line-height: 1.55; }
    .page[contenteditable="true"] { outline: 2px solid #80a6dd; outline-offset: 3px; }
    header { border-bottom: 2px solid var(--blue); padding-bottom: 10px; }
    h1 { margin: 0; font-size: 22pt; line-height: 1.25; }
    .intent { margin: 5px 0; color: var(--blue); font-weight: 650; }
    .contact { margin: 0; color: var(--muted); font-size: 9pt; }
    section { margin-top: 14px; }
    h2 { margin: 0 0 7px; padding-bottom: 3px; border-bottom: 1px solid var(--line); color: var(--blue); font-size: 11pt; }
    .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h3 { margin: 0; font-size: 10pt; }
    time { color: var(--muted); white-space: nowrap; font-size: 9pt; }
    p { margin: 4px 0; }
    ul { margin: 5px 0 0; padding-left: 18px; }
    li { margin: 4px 0; }
    strong { color: #111; font-weight: 700; }
    .status { width: min(210mm, calc(100% - 24px)); margin: 0 auto 18px; color: var(--muted); font-size: 12px; }
    @page { size: A4; margin: 16mm 18mm; }
    @media print {
      body { background: white; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar, .status { display: none; }
      .page { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; outline: none !important; }
      section { break-inside: avoid; }
    }
    @media screen and (max-width: 830px) { .toolbar { display: block; } .actions { margin-top: 9px; } .page { margin-left: 12px; margin-right: 12px; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <p>点击“编辑内容”修改正文；“保存HTML”会下载包含修改的新文件。</p>
    <div class="actions">
      <button id="edit-button" type="button" aria-pressed="false">编辑内容</button>
      <button id="save-button" type="button">保存HTML</button>
      <button id="print-button" class="primary" type="button">导出PDF</button>
    </div>
  </div>
  <!-- 生成简历时，将下方占位内容替换为用户确认的事实，删除没有证据的字段或段落。 -->
  <main id="resume" class="page" contenteditable="false" aria-label="简历正文">
    <header>
      <h1>[姓名]</h1>
      <p class="intent">[目标岗位]</p>
      <p class="contact">[用户提供的联系方式]</p>
    </header>
    <section>
      <h2>教育经历</h2>
      <div class="entry-head"><h3>[学校｜专业｜学历]</h3><time>[起止时间]</time></div>
      <p>[与岗位相关且已确认的信息]</p>
    </section>
    <section>
      <h2>实习经历</h2>
      <div class="entry-head"><h3>[公司｜岗位]</h3><time>[起止时间]</time></div>
      <ul><li><strong>[工作重点]</strong>：[个人行动、关键判断与可核实的结果]。</li></ul>
    </section>
    <section>
      <h2>项目经历</h2>
      <div class="entry-head"><h3>[项目名称｜个人角色]</h3><time>[起止时间]</time></div>
      <ul><li>[问题、个人贡献、实际交付阶段与结果]。</li></ul>
    </section>
  </main>
  <p id="status" class="status" role="status" aria-live="polite">当前为预览状态。</p>
  <script>
    (() => {
      const resume = document.getElementById('resume');
      const editButton = document.getElementById('edit-button');
      const status = document.getElementById('status');
      let editing = false;
      let dirty = false;
      editButton.addEventListener('click', () => {
        editing = !editing;
        resume.contentEditable = String(editing);
        editButton.setAttribute('aria-pressed', String(editing));
        editButton.textContent = editing ? '完成编辑' : '编辑内容';
        status.textContent = editing ? '点击正文即可修改；修改后请保存HTML。' : (dirty ? '修改尚未保存。' : '当前为预览状态。');
        if (editing) resume.focus();
      });
      resume.addEventListener('input', () => { dirty = true; status.textContent = '内容已修改，尚未保存。'; });
      document.getElementById('save-button').addEventListener('click', () => {
        const copy = document.documentElement.cloneNode(true);
        copy.querySelector('#resume').setAttribute('contenteditable', 'false');
        copy.querySelector('#edit-button').textContent = '编辑内容';
        copy.querySelector('#edit-button').setAttribute('aria-pressed', 'false');
        copy.querySelector('#status').textContent = '当前为预览状态。';
        const blob = new Blob(['<!doctype html>\n', copy.outerHTML], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '岗位适配简历.html';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        dirty = false;
        status.textContent = '已下载新HTML文件，请使用下载后的文件保留修改。';
      });
      document.getElementById('print-button').addEventListener('click', () => window.print());
      window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
    })();
  </script>
</body>
</html>
